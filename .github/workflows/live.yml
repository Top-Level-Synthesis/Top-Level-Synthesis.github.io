name: live-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the demos
        run: bash tools/live_check.sh live.json
      - name: Commit if the live flags changed
        run: |
          if git diff --quiet -I'"checked_at"' -- live.json; then
            echo "flags unchanged"; exit 0
          fi
          git config user.name "live-check"
          git config user.email "live-check@users.noreply.github.com"
          git add live.json
          git commit -m "live: $(python3 -c 'import json;d=json.load(open("live.json"));print("detect",d["detect"],"hb",d["hb"])')"
          git pull --rebase -q origin main
          git push -q origin main
